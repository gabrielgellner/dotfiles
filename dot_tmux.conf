# -- Basic settings --
set -g mouse on
set -g base-index 1
set-option -sg escape-time 10
set-option -g focus-events on

# terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
# set -g extended-keys on
# set -as terminal-features 'xterm*:extkeys'
set -g allow-rename off

# Killing the session you are attached to ends the client — tmux drops you out
# to the shell rather than to another session. The dev picker makes that easy to
# hit: ctrl-x kills the highlighted session, and the current session is
# deliberately in that list (bin/executable_dev explains why). Off switches the
# client to the most recently active remaining session instead, which is what
# was meant every time.
set -g detach-on-destroy off

# The console windows exist to hold build and test output that outlives nvim
# (see config/just.lua in the neovim config, which sends recipes there). tmux
# defaults to 2000 lines of scrollback, which one verbose test run can exceed —
# so the output deliberately routed there could scroll away before being read.
set -g history-limit 50000

unbind r
bind r source-file ~/.tmux.conf
bind-key C-j display-popup -E "dev"
bind-key Enter display-popup -E "dev"

set -g prefix C-a

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Copy to system clipboard (xclip on Linux, pbcopy on macOS)
if-shell 'command -v pbcopy >/dev/null' \
  'set -g @copy_cmd "pbcopy"' \
  'set -g @copy_cmd "xclip -selection clipboard -in -f | xclip -selection primary -in"'

bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"

# Paste from system clipboard with prefix + P
bind-key P run-shell 'if command -v pbpaste >/dev/null; then pbpaste; else xclip -selection clipboard -out; fi | tmux load-buffer - && tmux paste-buffer'

# No plugins, and so no plugin manager. tpm carried two: catppuccin, now written
# out as the theme block above, and vim-tmux-navigator, which forwarded
# <C-hjkl> into a pane running nvim and moved between tmux panes otherwise.
#
# The second was never used. Work here is divided into windows, reached with
# prefix + 1/2/3 — every window in every session holds a single pane, so there
# was nothing to navigate between. nvim binds <C-hjkl> to plain wincmd itself
# (config/keymaps.lua), which is the half that was actually in use.
#
# ── Theme: catppuccin frappe, written out rather than fetched ────────────────
# This was `set -g @plugin 'catppuccin/tmux#v2.1.3'` — 3.4MB and 131 files of
# shell and format templates to produce the dozen lines below. What the plugin
# actually left on the server was read back with `tmux show -g` and pasted here,
# with its @thm_* palette references resolved to the literal hex they held, so
# nothing is computed at load any more.
#
# Same treatment as dot_config/kitty/catppuccin-frappe.conf: the flavour is a
# fixed set of colours, so it is checked in rather than fetched. Upstream is
# catppuccin/tmux v2.1.3; the palette is frappe, matching nvim, bat, kitty and
# yazi.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#292c3c,fg=#c6d0f5"

set -g status-left-length 30
set -g status-left " #S "

set -g window-status-separator " "
set -g window-status-format "#[fg=#232634,bg=#949cbb] #I #[fg=#c6d0f5,bg=#414559] #W "
set -g window-status-current-format "#[fg=#232634,bg=#ca9ee6] #I #[fg=#c6d0f5,bg=#51576d] #W "
set -g window-status-activity-style "bg=#babbf1,fg=#232634"
set -g window-status-bell-style "bg=#e5c890,fg=#232634"

set -g pane-border-style "fg=#737994"
set -g pane-active-border-style "#{?pane_in_mode,fg=#babbf1,#{?pane_synchronized,fg=#ca9ee6,fg=#babbf1}}"

set -g message-style "fg=#81c8be,bg=default,align=centre"
set -g mode-style "bg=#414559,bold"

