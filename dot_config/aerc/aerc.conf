# aerc — the mail client. Reads Proton Mail through Proton Mail Bridge; the
# account itself is in accounts.conf, which is a template because it carries the
# address (see .chezmoi.toml.tmpl).

[ui]
# aerc's own catppuccin is already Frappé (base #303446, text #c6d0f5), so unlike
# kitty's and btop's there is nothing to vendor; stylesets/frappe is layered on
# top for the colours it leaves out.
styleset-name = catppuccin,frappe
threading-enabled = true

# Newest first. Only possible because the source is a maildir: over Bridge's
# IMAP, which lacks SORT, `:sort` answered "Sorting is not available for this
# backend" and the inbox sat in Bridge's sync order, November 2024 on top.
sort = -r date

# Labels arrive as `Labels/<name>`, two dozen of them; as a tree they fold
# under one node instead of filling the sidebar. In tree mode .Folder is the
# leaf name, so a `^Labels/` case never matches a label; everything that is
# not a system folder is one, hence the tag as the default.
dirlist-tree = true
dirlist-left = {{switch .Folder (case `^INBOX$` "󰚇 ") (case `^Drafts$` "󰷉 ") (case `^Sent$` "󰒊 ") (case `^Starred$` "󰓎 ") (case `^Archive$` "󰀼 ") (case `^Spam$` "󰀩 ") (case `^Trash$` "󰩺 ") (case `^All Mail$` "󰻧 ") (default "󰓹 ")}}{{.Folder}}
dirlist-right = {{if .Unread}}{{.Style (humanReadable .Unread) "count"}}{{end}}

# The default columns, each wrapped in a named style from stylesets/frappe.
column-flags = {{.Style (.Flags | join "") "flags"}}
column-name = {{.Style (index (.From | names) 0) "from"}}
column-subject = {{.Style .ThreadPrefix "thread"}}{{.Subject}}
column-date = {{.Style (.DateAutoFormat .Date.Local) "date"}}

# Nerd Font glyphs (kitty's FiraCode Nerd Font), looked up by name in
# nerd-fonts' glyphnames.json rather than typed: md-email, md-email_outline,
# md-paperclip, md-reply, md-share, md-flag, md-check_bold, md-pencil, md-delete.
icon-new = 󰇮
icon-old = 󰇰
icon-attachment = 󰏢
icon-replied = 󰑚
icon-forwarded = 󰒖
icon-flagged = 󰈻
icon-marked = 󰸞
icon-draft = 󰏫
icon-deleted = 󰆴

# The shipped aerc.conf's filters, restated because they are not inherited:
# with this file present and no [filters] section, an HTML mail opened to "No
# filter configured for this mimetype ('text/html')" (measured, 0.22.0).
# `html` is w3m with networking off, so remote images and trackers stay unfetched.
[filters]
text/plain=colorize
text/calendar=calendar
message/delivery-status=colorize
message/rfc822=colorize
text/html=! html
.headers=colorize
