# timout for commands, defaults to 500
command_timeout = 1000

[container]
disabled = true

# Stop showing the global python on PATH
[python]
disabled = true

# Show the uv environment python version when in a uv project
[custom.uv_python]
when = "test -f pyproject.toml"
command = "uv run python -c \"import sys; print('.'.join(map(str, sys.version_info[:3])))\""
format = "via [🐍 $output]($style) "
style = "green"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
vimcmd_replace_one_symbol = "[❮](purple)"
vimcmd_replace_symbol = "[❮](purple)"
vimcmd_visual_symbol = "[❮](yellow)"
