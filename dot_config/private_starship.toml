# timeout for commands, defaults to 500
# command_timeout = 1000

[container]
disabled = true

# Stop showing the global python on PATH
[python]
disabled = true

# Show the uv project's Python version.
#
# `when` requires both files, so the command cannot fail and the module simply
# does not appear when there is nothing to report. This used to fall back to
# grepping `requires-python` out of pyproject.toml, which is a floor (">=3.13")
# rather than the installed version — the one branch that could report something
# untrue, covering a case that does not arise, since uv writes .python-version.
#
# Reads the file rather than running .venv/bin/python. Measured over 20 runs:
# cat 2.0ms, pyvenv.cfg 3.8ms, forking the interpreter 4.4ms — and this runs on
# every prompt. The cost of that choice is that editing .python-version without
# re-running `uv sync` shows the intended version rather than what the venv has.
[custom.uv_python]
when = "test -f uv.lock && test -f .python-version"
command = "cat .python-version"
format = "via [🐍 $output]($style) "
style = "green"

# The named colours resolve through the terminal, so they land on frappe the way
# `dev`'s ANSI markers do. Replace mode is the exception: there is no ANSI name
# for mauve, so it is spelled out — #ca9ee6, frappe's, matching dot_tmux.conf
# and the kitty theme. It read #cba6f7 for a while, which is *mocha* mauve and
# the only stray from another flavour in the tracked configs.
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](#ca9ee6)"
vimcmd_replace_symbol = "[❮](#ca9ee6)"
vimcmd_visual_symbol = "[❮](yellow)"
