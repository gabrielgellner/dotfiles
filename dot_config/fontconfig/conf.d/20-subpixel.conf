<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Subpixel (RGB) antialiasing, Omarchy only. The stock Arch setup is grayscale
  with slight hinting, which read thin on the BenQ's 107 ppi. With this, the
  Omarchy bar (Qt) drew its text with blue-left / orange-right fringes and
  full-brightness stroke cores — measured on grim crops of the clock before
  and after `omarchy restart shell`, 2026-10-25 — and it looked crisper.

  Honoured by Qt and Chromium/Electron; kitty and GTK 4 draw grayscale
  regardless. If text ever shows coloured blur instead, the panel's order is
  the other one: change rgb to bgr.

  A drop-in rather than fonts.conf, which `omarchy font set` rewrites whole.
-->
<fontconfig>
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
