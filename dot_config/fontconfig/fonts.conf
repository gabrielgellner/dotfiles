<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font rendering for xrdp/Xvnc. Only the Linux machine reads this at all —
  macOS goes through CoreText and ignores fontconfig entirely, which is why a
  mistake in here can sit unnoticed for a long time.

    - antialias on (no jagged edges)
    - full hinting — FiraCode stays crisp at small sizes
    - subpixel RGB with the default LCD filter

  Note that rgba=rgb makes lcdfilter live rather than inert; the two go
  together. If a session ever shows colour fringing on text, that pair is the
  thing to change: rgba=none renders grayscale and makes lcdfilter moot.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias"  mode="assign"><bool>true</bool></edit>
    <edit name="hinting"    mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"  mode="assign"><const>hintfull</const></edit>
    <edit name="rgba"       mode="assign"><const>rgb</const></edit>
    <edit name="autohint"   mode="assign"><bool>false</bool></edit>
    <edit name="lcdfilter"  mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Default monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font Mono</family>
      <family>FiraCode Nerd Font</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
