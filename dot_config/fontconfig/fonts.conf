<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font rendering tuned for xrdp/Xvnc at 16bpp:
    - antialias on (no jagged edges)
    - slight hinting (modern default; FiraCode has good native hinting)
    - grayscale (rgba=none) — subpixel RGB at 16bpp causes visible color fringing
    - lcdfilter is harmless when grayscale
-->
<fontconfig>
  <match target="font">
    <edit name="antialias"  mode="assign"><bool>true</bool></edit>
    <edit name="hinting"    mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"  mode="assign"><const>hintfull</const></edit>
    <edit name="rgba"       mode="assign"><const>rgb</const></edit>
    <edit name="autohint"   mode="assign"><bool>false</bool></edit>
    <edit name="lcdfilter"  mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Default monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font Mono</family>
      <family>FiraCode Nerd Font</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
