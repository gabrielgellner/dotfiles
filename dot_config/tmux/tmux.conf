# Deliberately empty. The tmux config is ~/.tmux.conf (dot_tmux.conf).
#
# tmux 3.8 loads *both* ~/.tmux.conf and $XDG_CONFIG_HOME/tmux/tmux.conf, in
# that order, despite its man page reading as either-or. Omarchy installs its
# own config at this path, so it ran second and won: on a fresh server
# (`tmux -L probe`) @copy_cmd from ~/.tmux.conf was set, yet the prefix was
# Omarchy's C-Space and the status bar sat at the top. Replacing this file
# with nothing leaves ~/.tmux.conf the only config with anything in it.
#
# Applied on Omarchy only (.chezmoiignore); the other machines have no file
# here. An Omarchy update that rewrites it shows up in `chezmoi diff`.
