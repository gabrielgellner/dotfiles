# `timestamp` is a Unix epoch and Tera's `date` filter formats it in UTC unless
# told otherwise, so a release cut in the evening here was stamped with
# tomorrow's date — v1.1.0, tagged 2026-08-27 19:40 MDT (01:40 UTC the next
# day), came out "2026-08-28". It reads 2026-08-27 now, which is the fix
# working. The tag was recut afterwards, so 19:40 is what `git for-each-ref`
# reports today; an earlier version of this note quoted the original 19:16.
#
# The zone is named rather than read from the machine because Tera cannot read
# one, and a fixed zone is the better default anyway: two machines in different
# places then still date a release the same. The cost is that a release cut from
# another zone is dated in this one — the v0.1.x tags were made at -0400 and
# still land on the right day here, but a late-evening release from further east
# would not.
# Breaking changes are marked inline rather than given a section of their own.
# `feat(nvim)!: drop Haskell support` is the only one so far, and it belongs
# under Features where it happened; a second heading would separate it from the
# change it *is*. The `!` is what git-cliff reads — it sets commit.breaking, and
# it is also what makes `just next-version` say v2.0.0 rather than v1.2.0, so
# the marker and the version bump come from the same character.
#
# breaking_description is appended only when it says something the subject does
# not. With a bare `!` and no BREAKING CHANGE footer git-cliff fills it with the
# description itself, which would render the line twice.
#
# protect_breaking_commits stays false below: it stops a breaking commit being
# dropped by a skip parser, and the only skip parser here is chore(release),
# which cannot be breaking.
[changelog]
header = "# Changelog\n\nAll notable changes to this dotfiles repository are documented here.\n"
body = """
{% if version %}\
## [{{ version }}] — {{ timestamp | date(format="%Y-%m-%d", timezone="America/Edmonton") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %}
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v?[0-9].*"
sort_commits = "newest"

# The group string carries a zero-padded sort key in an HTML comment, which the
# body template strips back out before rendering. git-cliff sorts groups
# lexicographically and has no other ordering control, so without this the
# headings come out alphabetically and Chores outranks Features. Zero-padded
# because "10" sorts before "5" as a string.
#
# Several types below are listed ahead of any use: test, build, ci, perf and
# revert have no commits in this repo at all. They are here because an unlisted
# conventional type is not dropped — it renders with its raw type as the heading
# ("### style", beside "### Features"), so listing them is what makes the
# heading read "Tests" rather than "test" on the day one arrives. An unknown
# type still shows up that way, which is useful: a typo like "fux:" announces
# itself.
#
# style is no longer in that set — there are four style(nvim) commits and the
# changelog renders "### Styling" for them.
commit_parsers = [
  # Three commits from before this repo settled on conventional commits. They
  # parse, but their types are invented, so each raised a heading of its own.
  # Matched ahead of everything else and mapped onto real groups. main rejects
  # force-push, so these subjects cannot be fixed at the source.
  { message = "^chezmoi: enable git autoCommit", group = "<!-- 10 -->Chores"   },
  { message = "^nvim: bump lazy-lock",           group = "<!-- 10 -->Chores"   },
  { message = "^nvim/zk: auto-reindex",          group = "<!-- 00 -->Features" },

  # The release commits themselves. They carry no change of their own — the
  # version they name is already the heading above them — and they arrive a
  # release late, since each regeneration runs before its own release commit
  # exists. Skipped ahead of the `^chore` line below, which would otherwise
  # catch them.
  { message = '^chore\(release\)', skip = true },

  { message = "^feat",     group = "<!-- 00 -->Features"      },
  { message = "^fix",      group = "<!-- 01 -->Bug Fixes"     },
  { message = "^perf",     group = "<!-- 02 -->Performance"   },
  { message = "^refactor", group = "<!-- 03 -->Refactoring"   },
  { message = "^docs",     group = "<!-- 04 -->Documentation" },
  { message = "^test",     group = "<!-- 05 -->Tests"         },
  { message = "^build",    group = "<!-- 06 -->Build"         },
  { message = "^ci",       group = "<!-- 07 -->CI"            },
  { message = "^style",    group = "<!-- 08 -->Styling"       },
  { message = "^revert",   group = "<!-- 09 -->Reverts"       },
  { message = "^chore",    group = "<!-- 10 -->Chores"        },
]

protect_breaking_commits = false
filter_commits = false
