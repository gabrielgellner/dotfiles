# `timestamp` is a Unix epoch and Tera's `date` filter formats it in UTC unless
# told otherwise, so a release cut in the evening here was stamped with
# tomorrow's date — v1.1.0, tagged 2026-08-27 19:16 MDT, came out "2026-08-28".
#
# The zone is named rather than read from the machine because Tera cannot read
# one, and a fixed zone is the better default anyway: two machines in different
# places then still date a release the same. The cost is that a release cut from
# another zone is dated in this one — the v0.1.x tags were made at -0400 and
# still land on the right day here, but a late-evening release from further east
# would not.
[changelog]
header = "# Changelog\n\nAll notable changes to this dotfiles repository are documented here.\n"
body = """
{% if version %}\
## [{{ version }}] — {{ timestamp | date(format="%Y-%m-%d", timezone="America/Edmonton") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v?[0-9].*"
sort_commits = "newest"

# The group string carries a zero-padded sort key in an HTML comment, which the
# body template strips back out before rendering. git-cliff sorts groups
# lexicographically and has no other ordering control, so without this the
# headings come out alphabetically and Chores outranks Features. Zero-padded
# because "10" sorts before "5" as a string.
#
# test, build and style are listed not because this repo uses them but because
# an unlisted conventional type is not dropped — it renders with its raw type as
# the heading ("### style", beside "### Features"). An unknown type still shows
# up that way, which is useful: a typo like "fux:" announces itself.
commit_parsers = [
  # Three commits from before this repo settled on conventional commits. They
  # parse, but their types are invented, so each raised a heading of its own.
  # Matched ahead of everything else and mapped onto real groups. main rejects
  # force-push, so these subjects cannot be fixed at the source.
  { message = "^chezmoi: enable git autoCommit", group = "<!-- 10 -->Chores"   },
  { message = "^nvim: bump lazy-lock",           group = "<!-- 10 -->Chores"   },
  { message = "^nvim/zk: auto-reindex",          group = "<!-- 00 -->Features" },

  { message = "^feat",     group = "<!-- 00 -->Features"      },
  { message = "^fix",      group = "<!-- 01 -->Bug Fixes"     },
  { message = "^perf",     group = "<!-- 02 -->Performance"   },
  { message = "^refactor", group = "<!-- 03 -->Refactoring"   },
  { message = "^docs",     group = "<!-- 04 -->Documentation" },
  { message = "^test",     group = "<!-- 05 -->Tests"         },
  { message = "^build",    group = "<!-- 06 -->Build"         },
  { message = "^ci",       group = "<!-- 07 -->CI"            },
  { message = "^style",    group = "<!-- 08 -->Styling"       },
  { message = "^revert",   group = "<!-- 09 -->Reverts"       },
  { message = "^chore",    group = "<!-- 10 -->Chores"        },
]

protect_breaking_commits = false
filter_commits = false
